name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...
      - name: build
        shell: bash
        run: go build -trimpath -o statusline ./cmd/statusline
      - name: smoke test (unix)
        if: runner.os != 'Windows'
        run: |
          ./statusline --version
          echo '{"hook_event_name":"Status","session_id":"s1","workspace":{"current_dir":"/tmp/demo"},"model":{"display_name":"Demo"},"version":"1.0.0","context_window":{"context_window_size":1000000}}' | ./statusline bar | cat -v
          echo '{"agent_state":"idle","workspace":{"current_dir":"/tmp/demo"}}' | ./statusline title
